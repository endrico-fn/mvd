name: CI — Format, Clippy, Security & Unit Tests

on:
  push:
    branches: ["main", "master", "feat/**"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  lint-and-format:
    name: Rustfmt & Strict Clippy (No unwrap/expect/unsafe)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system headers for Wayland clipboard
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxcb1-dev

      - name: Verify formatting with rustfmt
        run: |
          cargo fmt --all
          git diff --stat

      - name: Run strict Clippy linter
        run: cargo clippy --all-targets --all-features -- -D warnings -D clippy::unwrap_used -D clippy::expect_used

  unit-and-security-tests:
    name: Unit, Parser (T-01..T-07), Playlist Override & pbf03 Cookie Isolation Suite
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Run full test suite
        run: cargo test --all-targets -- --nocapture

  build-release-artifact:
    name: Compile & Publish Portable Release Binary (curl-ready)
    runs-on: ubuntu-latest
    needs: unit-and-security-tests
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2

      - name: Build stripped release binary
        run: |
          cargo build --release --locked || cargo build --release
          sha256sum target/release/mvd > target/release/mvd.sha256

      - name: Upload pre-built mvd binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: mvd-x86_64-unknown-linux-gnu
          path: |
            target/release/mvd
            target/release/mvd.sha256
          retention-days: 14

      - name: Publish Portable GitHub Release for Direct curl Download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f v0.1.0
          git push origin -f v0.1.0
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 target/release/mvd target/release/mvd.sha256 --clobber
          else
            gh release create v0.1.0 target/release/mvd target/release/mvd.sha256 \
              --title "mvd v0.1.0 (Latest Portable Linux x86_64 Build)" \
              --notes "Portable pre-compiled Linux x86_64 binary. Download directly with curl:\n\`\`\`sh\ncurl -fLo mvd https://github.com/endrico-fn/mvd/releases/latest/download/mvd && chmod +x mvd\n\`\`\`" \
              --latest
          fi
